name: Memory plugin tests
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        shell: pwsh
        run: python -m pip install "zvec==0.6.0" numpy requests
      - name: Check syntax
        run: python -m py_compile __init__.py tests/test_idempotent.py
      - name: Test memory writes
        run: python -m unittest discover -s tests -p 'test_*.py' -v
